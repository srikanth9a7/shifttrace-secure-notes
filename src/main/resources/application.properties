spring.application.name=shifttrace-secure-notes
server.port=8443
# Use loopback for the lab. See README before enabling LAN access.
server.address=${SERVER_ADDRESS:127.0.0.1}
server.ssl.enabled=true
server.ssl.key-store=file:./certs/localhost.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=shifttrace
server.ssl.key-store-password=${SSL_STORE_PASSWORD}
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.datasource.url=jdbc:h2:file:./data/shifttrace;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
# Both account passwords must be supplied by environment variables.
demo.analyst.password=${ANALYST_PASSWORD}
demo.admin.password=${ADMIN_PASSWORD}
server.error.include-message=never
